<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfcf8">
  <title>Sporty Predict</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23aff33e'/><circle cx='16' cy='16' r='7' fill='none' stroke='%23000' stroke-width='2.5'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <script>
    // Apply the theme before first paint (saved choice, else system preference).
    try {
      const t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch { /* storage blocked */ }
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <button id="menu" class="icon-btn only-mobile" aria-label="Competizioni">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <a class="brand" href="#/"><span class="brand-mark"></span><span>Sporty<b>Predict</b></span></a>
    <div class="search">
      <svg class="search-ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Cerca squadra" autocomplete="off">
      <div id="search-results" class="search-results" hidden></div>
    </div>
    <button id="theme" class="icon-btn" aria-label="Cambia tema">
      <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button id="refresh" class="icon-btn" aria-label="Aggiorna dati" title="Aggiorna dati">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <span class="side-title">Competizioni</span>
        <button id="menu-close" class="icon-btn only-mobile" aria-label="Chiudi">✕</button>
      </div>
      <div class="side-filter"><input id="league-filter" type="search" placeholder="Filtra…" autocomplete="off"></div>
      <nav id="leagues"></nav>
    </aside>
    <div id="nav-backdrop" class="nav-backdrop"></div>

    <main id="main">
      <div class="loading">Caricamento…</div>
    </main>
  </div>

  <div id="detail-backdrop" class="detail-backdrop" hidden></div>
  <section id="detail" class="detail" hidden></section>

  <button id="to-top" class="to-top" aria-label="Torna su" title="Torna su">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <script type="module" src="/app.js"></script>
</body>
</html>
