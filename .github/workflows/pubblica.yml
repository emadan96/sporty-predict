# Aggiorna i pronostici e pubblica il sito statico su Cloudflare (gratis).
# Segreti richiesti (Settings → Secrets and variables → Actions):
#   APIFOOTBALL_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Pubblica pronostici

on:
  # Gli orari (9:17, 13:17, 17:17, 21:17) li dà il cron di Cloudflare in cron/: avvia questo workflow
  # tramite workflow_dispatch, perché i lanci programmati di GitHub arrivano in ritardo o saltano.
  workflow_dispatch:       # pulsante "Run workflow" per aggiornare a mano
  push:
    branches: [main]

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Europe/Rome
      APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Archivi CSV e cache API-Football tra un'esecuzione e l'altra: evita di consumare la quota giornaliera.
      - name: Ripristina archivi
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Aggiorna dati e genera il sito
        run: node server/build-static.js --sync

      - name: Salva archivi
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      - name: Pubblica su Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
